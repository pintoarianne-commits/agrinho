<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgroWater - Calculadora de Consumo de Água</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        background:#e8f5e9;
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
        padding:20px;
    }

    .container{
        background:white;
        width:100%;
        max-width:500px;
        padding:30px;
        border-radius:15px;
        box-shadow:0 4px 15px rgba(0,0,0,0.2);
    }

    h1{
        text-align:center;
        color:#2e7d32;
        margin-bottom:20px;
    }

    label{
        display:block;
        margin-top:15px;
        font-weight:bold;
    }

    input, select{
        width:100%;
        padding:10px;
        margin-top:5px;
        border:1px solid #ccc;
        border-radius:8px;
    }

    button{
        width:100%;
        padding:12px;
        margin-top:20px;
        background:#2e7d32;
        color:white;
        border:none;
        border-radius:8px;
        cursor:pointer;
        font-size:16px;
    }

    button:hover{
        background:#1b5e20;
    }

    .resultado{
        margin-top:20px;
        padding:15px;
        border-radius:10px;
        background:#f1f8e9;
        display:none;
    }

    .resultado h2{
        color:#2e7d32;
        margin-bottom:10px;
    }
</style>
</head>
<body>

<div class="container">
    <h1>🌱 AgroWater</h1>

    <label>Cultura</label>
    <select id="cultura">
        <option>Soja</option>
        <option>Milho</option>
        <option>Feijão</option>
        <option>Hortaliças</option>
    </select>

    <label>Área Plantada (hectares)</label>
    <input type="number" id="area" placeholder="Ex: 5">

    <label>Irrigação Diária (litros)</label>
    <input type="number" id="agua" placeholder="Ex: 12000">

    <button onclick="calcular()">Calcular Consumo</button>

    <div class="resultado" id="resultado">
        <h2>Resultado</h2>
        <p id="consumo"></p>
        <p id="classificacao"></p>
        <p id="dica"></p>
    </div>
</div>

<script>
function calcular() {
    const area = Number(document.getElementById("area").value);
    const agua = Number(document.getElementById("agua").value);

    if(area <= 0 || agua <= 0){
        alert("Preencha os campos corretamente!");
        return;
    }

    const consumoMensal = agua * 30;

    let classificacao = "";
    let dica = "";

    if(consumoMensal < 100000){
        classificacao = "Baixo";
        dica = "Excelente! Continue utilizando práticas sustentáveis.";
    }
    else if(consumoMensal < 500000){
        classificacao = "Moderado";
        dica = "Considere sensores de umidade para otimizar a irrigação.";
    }
    else{
        classificacao = "Alto";
        dica = "Avalie irrigação por gotejamento e captação de água da chuva.";
    }

    document.getElementById("consumo").innerHTML =
        `<strong>Consumo Mensal:</strong> ${consumoMensal.toLocaleString('pt-BR')} litros`;

    document.getElementById("classificacao").innerHTML =
        `<strong>Classificação:</strong> ${classificacao}`;

    document.getElementById("dica").innerHTML =
        `<strong>Dica Sustentável:</strong> ${dica}`;

    document.getElementById("resultado").style.display = "block";
}
</script>

</body>
</html>
